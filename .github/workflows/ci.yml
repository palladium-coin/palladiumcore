name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck codespell python3-pip
          pip3 install flake8
      - name: Lint
        run: test/lint/lint-all.sh

  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            python3 python3-zmq ccache libevent-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-test-dev libboost-thread-dev libdb++-dev libsqlite3-dev libzmq3-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-build-${{ github.sha }}
          restore-keys: ccache-build-
      - name: Build
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ./autogen.sh
          ./configure --without-gui --with-incompatible-bdb --disable-bench --without-miniupnpc --without-natpmp
          make -j"$(nproc)"
      - name: Unit tests
        run: make check
      - name: Functional tests
        run: test/functional/test_runner.py --jobs="$(nproc)" --combinedlogslen=4000 --failfast
      - name: Upload the test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            src/test/*.log
            /tmp/test_runner_*/**/test_framework.log

  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libtool autotools-dev automake pkg-config bsdmainutils \
            python3 ccache libevent-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-test-dev libboost-thread-dev libdb++-dev libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-
      - name: Build the fuzz targets (libFuzzer, ASan and UBSan)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ./autogen.sh
          CC=clang CXX=clang++ ./configure --enable-fuzz --with-sanitizers=fuzzer,address,undefined \
            --without-gui --with-incompatible-bdb --disable-bench --without-miniupnpc --without-natpmp
          make -C src -j"$(nproc)" $(grep -o "test/fuzz/[a-z_0-9]*" src/Makefile.test.include | sort -u \
            | grep -v "^test/fuzz/\(fuzz\|util\|test_runner\|deserialize\)$" | tr '\n' ' ')
      - name: Run every target on the seed corpus
        run: python3 test/fuzz/test_runner.py test/fuzz/corpus
